    <div id="wrapper">

        <header>
            <h1>Jerin Muthalakuzhiyil</h1>

                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>

            </nav>
        </header>

        <main>
            <h2>Contact Me</h2>
            <p>Have a question or want to work together? Send me a message!</p>

            <!-- Form sends data to my email -->
            <form action="mailto:jerin.muthalakuzhiyil@ontariotechu.net" method="post" enctype="text/plain">

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="cell">Cell No.:</label><br>
                    <input type="tel" id="cell" name="cell" required>
                </p>

                <p>
                    <label for="comments">Comments:</label><br>
                    <textarea id="comments" name="comments" rows="6" cols="50"></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit">
                </p>

            </form>
        </main>

        <footer>
            <address>
                <p>Contact: <a href="mailto:jerin.muthalakuzhiyil@ontariotechu.net">jerin.muthalakuzhiyil@ontariotechu.net</a></p>
            </address>

        </footer>

    </div>
